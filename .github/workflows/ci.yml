name: CI

on:
  push:
  pull_request:
  # The Release workflow starts CI on the pull request it opens, since its
  # own pushes start no workflows.
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # Arm's official toolchain, not Homebrew's arm-none-eabi-gcc formula:
      # the formula has no C library, so it cannot link firmware.
      - name: Install the embedded toolchain
        run: |
          brew install --cask gcc-arm-embedded
          brew install open-ocd

      - name: Build and run tests
        env:
          # xcodebuild passes TEST_RUNNER_* variables to the tests with the
          # prefix removed. This makes a missing tool fail instead of skip.
          TEST_RUNNER_UMEIL_REQUIRE_TOOLS: "1"
          # The hosted runner has three cores and runs every test at once,
          # so work that takes a second on a Mac can take several here.
          # Timing checks allow three times as long (see TestTiming.swift).
          TEST_RUNNER_UMEIL_TIMING_SCALE: "3"
        run: |
          set -o pipefail
          xcodebuild test \
            -project uMeil.xcodeproj \
            -scheme uMeil \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath TestResults.xcresult

      # The log lists failing tests but not why; the result bundle has the
      # messages.
      - name: Show why tests failed
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult \
            | python3 -c '
          import json, sys
          def walk(node, path, failed):
              name = node.get("name", "")
              if node.get("nodeType") == "Test Case":
                  path, failed = name, node.get("result") == "Failed"
              elif node.get("nodeType") == "Failure Message" and failed:
                  print(f"{path}: {name}")
              for child in node.get("children", []):
                  walk(child, path, failed)
          for node in json.load(sys.stdin)["testNodes"]:
              walk(node, "", False)
          '

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult

  hardware:
    name: Hardware-in-the-loop
    # Flashes a real EK-TM4C1294XL and reads its UART. Needs a Mac with the
    # board plugged in, registered as a self-hosted runner with the label
    # "launchpad". Skipped until the repository variable HIL_RUNNER is set
    # to "true". Only for pushes, so a pull request from a fork cannot run
    # code on that Mac.
    if: vars.HIL_RUNNER == 'true' && github.event_name == 'push'
    runs-on: [self-hosted, macOS, launchpad]
    steps:
      - uses: actions/checkout@v7

      - name: Flash the board and read its UART
        env:
          TEST_RUNNER_UMEIL_HIL: "1"
          TEST_RUNNER_UMEIL_REQUIRE_TOOLS: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project uMeil.xcodeproj \
            -scheme uMeil \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:uMeilTests/HardwareInTheLoopTests

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint if missing
        run: command -v swiftlint || brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Check release script syntax
        run: bash -n Scripts/make-release.sh

      - name: Test the release scripts
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'

  package:
    name: Release build
    # Builds the DMG the way a release does, unsigned, to catch packaging
    # problems (a framework that will not load, a missing resource) before
    # a tag is pushed. Only on main, since it takes a few minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the DMG
        run: Scripts/make-release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: uMeil-dmg
          path: dist/uMeil-*.dmg
          retention-days: 7
