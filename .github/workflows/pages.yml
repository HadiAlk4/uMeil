name: Website

# Publishes site/ (the download page and Sparkle's appcast.xml) to GitHub
# Pages at https://hadialk4.github.io/uMeil/. Needs Pages turned on with
# "GitHub Actions" as the source, in Settings > Pages.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the update feed and the page
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('site/appcast.xml')"
          test -f site/screenshot.png
          grep -q 'releases/latest/download/uMeil.dmg' site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
